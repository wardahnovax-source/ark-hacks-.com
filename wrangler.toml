# CI Workers Builds project name (repo: arkcheats)
name = "arkhacks"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

# Cloudflare CI runs `npx wrangler deploy` — build static assets before upload.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://arkhacks.com 301s always apply
run_worker_first = true
